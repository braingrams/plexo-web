name: Sync Secrets to SSM

# Manually triggered whenever a secret is added or rotated in GitHub. Deliberately NOT
# run through CDK/CloudFormation — secret values would otherwise end up embedded in the
# stack template and its change history. This writes directly to SSM via the AWS CLI,
# scoped to a role that can only touch /plexo/* parameters and nothing else in the
# account. SSM Standard-tier SecureString params (default AWS-managed key) are free —
# no Secrets Manager, no customer-managed KMS key, no per-secret monthly charge.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment's parameters to update"
        required: true
        type: choice
        options: [staging, production]

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    if: github.repository == 'Challaris/plexo-web'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
      AI_KEY_ENCRYPTION_SECRET: ${{ secrets.AI_KEY_ENCRYPTION_SECRET }}
      PAYSTACK_KEY_ENCRYPTION_SECRET: ${{ secrets.PAYSTACK_KEY_ENCRYPTION_SECRET }}
      COMMERCE_DIGITAL_ACCESS_ENCRYPTION_SECRET: ${{ secrets.COMMERCE_DIGITAL_ACCESS_ENCRYPTION_SECRET }}
      MAILDRIP_KEY_ENCRYPTION_SECRET: ${{ secrets.MAILDRIP_KEY_ENCRYPTION_SECRET }}
      MAILDRIP_API_URL: ${{ secrets.MAILDRIP_API_URL }}
      MAILDRIP_API_KEY: ${{ secrets.MAILDRIP_API_KEY }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
      STRIPE_PRICE_ULTRA: ${{ secrets.STRIPE_PRICE_ULTRA }}
      STRIPE_PRICE_TOPUP_SMALL: ${{ secrets.STRIPE_PRICE_TOPUP_SMALL }}
      STRIPE_PRICE_TOPUP_MEDIUM: ${{ secrets.STRIPE_PRICE_TOPUP_MEDIUM }}
      STRIPE_PRICE_TOPUP_LARGE: ${{ secrets.STRIPE_PRICE_TOPUP_LARGE }}
      SYSTEM_AI_PROVIDER: ${{ secrets.SYSTEM_AI_PROVIDER }}
      SYSTEM_AI_KEY_ANTHROPIC_CLAUDE: ${{ secrets.SYSTEM_AI_KEY_ANTHROPIC_CLAUDE }}
      SYSTEM_AI_KEY_OPENAI: ${{ secrets.SYSTEM_AI_KEY_OPENAI }}
      SYSTEM_AI_KEY_GOOGLE_GEMINI: ${{ secrets.SYSTEM_AI_KEY_GOOGLE_GEMINI }}
      PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
      PUSHER_KEY: ${{ secrets.PUSHER_KEY }}
      PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
      PUSHER_CLUSTER: ${{ secrets.PUSHER_CLUSTER }}
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
      PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
      UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::919927637684:role/github-actions-plexo-deploy
          aws-region: us-east-1

      - name: Push each secret to its SSM parameter (only if actually set)
        run: |
          set -e
          for NAME in AUTH_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_SAFE_BROWSING_API_KEY \
            AI_KEY_ENCRYPTION_SECRET PAYSTACK_KEY_ENCRYPTION_SECRET \
            COMMERCE_DIGITAL_ACCESS_ENCRYPTION_SECRET MAILDRIP_KEY_ENCRYPTION_SECRET \
            MAILDRIP_API_URL MAILDRIP_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET \
            STRIPE_PRICE_PRO STRIPE_PRICE_ULTRA STRIPE_PRICE_TOPUP_SMALL STRIPE_PRICE_TOPUP_MEDIUM \
            STRIPE_PRICE_TOPUP_LARGE SYSTEM_AI_PROVIDER SYSTEM_AI_KEY_ANTHROPIC_CLAUDE SYSTEM_AI_KEY_OPENAI \
            SYSTEM_AI_KEY_GOOGLE_GEMINI PUSHER_APP_ID PUSHER_KEY PUSHER_SECRET PUSHER_CLUSTER \
            BROWSERBASE_API_KEY PEXELS_KEY PIXABAY_KEY UNSPLASH_KEY; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              echo "::warning::$NAME is not set in this environment's GitHub secrets — skipping, leaving SSM value unchanged"
              continue
            fi
            aws ssm put-parameter \
              --name "/plexo/${TARGET_ENV}/${NAME}" \
              --value "$VALUE" \
              --type SecureString \
              --key-id "alias/aws/ssm" \
              --overwrite \
              --region us-east-1 > /dev/null
            echo "✓ Updated /plexo/${TARGET_ENV}/${NAME}"
          done
