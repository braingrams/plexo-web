name: Sync Secrets to SSM

# Manually triggered whenever a secret is added or rotated in GitHub. Deliberately NOT
# run through CDK/CloudFormation — secret values would otherwise end up embedded in the
# stack template and its change history. This writes directly to SSM via the AWS CLI,
# scoped to a role that can only touch /plexo/* parameters and nothing else in the
# account. SSM Standard-tier SecureString params (default AWS-managed key) are free —
# no Secrets Manager, no customer-managed KMS key, no per-secret monthly charge.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Which environment's parameters to update"
        required: true
        type: choice
        options: [staging, production]

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    if: github.repository == 'Challaris/plexo-web'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      TARGET_ENV: ${{ inputs.environment }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::919927637684:role/github-actions-plexo-deploy
          aws-region: us-east-1

      - name: Push each secret to its SSM parameter (only if actually set)
        run: |
          set -e
          for NAME in AUTH_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              echo "::warning::$NAME is not set in this environment's GitHub secrets — skipping, leaving SSM value unchanged"
              continue
            fi
            aws ssm put-parameter \
              --name "/plexo/${TARGET_ENV}/${NAME}" \
              --value "$VALUE" \
              --type SecureString \
              --key-id "alias/aws/ssm" \
              --overwrite \
              --region us-east-1 > /dev/null
            echo "✓ Updated /plexo/${TARGET_ENV}/${NAME}"
          done
