name: PR | Destroy Compute Stack Preview

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull Request number to destroy"
        required: true

permissions:
  id-token: write # required for OIDC — no static AWS keys anywhere in this workflow
  contents: read

jobs:
  destroy:
    if: github.repository == 'Challaris/plexo-web'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ inputs.pr_number || github.event.number }}
      STACK_KIND: compute
      PLEXO_ENV: staging
      AWS_ACCOUNT_ID: "919927637684"
      AWS_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve and guard STACK_ID
        run: |
          STACK_ID="pr-${PR_NUMBER}-plexo"
          if [[ ! "$STACK_ID" =~ ^pr-[0-9]+-plexo$ ]]; then
            echo "::error::Resolved STACK_ID '$STACK_ID' doesn't match the required pr-<number>-plexo pattern — refusing to destroy anything."
            exit 1
          fi
          echo "STACK_ID=$STACK_ID" >> "$GITHUB_ENV"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::919927637684:role/github-actions-plexo-deploy
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install CDK project
        working-directory: ./cdk
        run: npm install

      # cdk/bin/app.ts unconditionally imports compute-stack.ts (every STACK_KIND does,
      # not just "compute" — see cdk/bin/app.ts), which throws at module load if these
      # aren't set (see that file's own comment) — required even to run `cdk destroy`,
      # not just `cdk deploy`. Reuses staging's real values; nothing here depends on
      # them matching what the stack was originally deployed with.
      # `::add-mask::` BEFORE writing to $GITHUB_ENV — without it these values print in
      # plaintext in this step's own log (confirmed by a real run: both secrets appeared
      # unmasked in the "##[endgroup]" env dump every later step logs). $GITHUB_ENV only
      # makes a value available to subsequent steps; it does not register it as a secret
      # to redact from output.
      - name: Fetch staging's secrets required just to load the CDK app
        run: |
          ORIGIN_VERIFY_SECRET="$(aws ssm get-parameter --name /plexo/staging/PLEXO_ORIGIN_VERIFY_SECRET --with-decryption --query Parameter.Value --output text)"
          CRON_SECRET="$(aws ssm get-parameter --name /plexo/staging/CRON_SECRET --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$ORIGIN_VERIFY_SECRET"
          echo "::add-mask::$CRON_SECRET"
          echo "ORIGIN_VERIFY_SECRET=$ORIGIN_VERIFY_SECRET" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"

      # `cdk destroy` still synthesizes the stack before deleting it — every
      # lambda.Code.fromAsset()/s3deploy.Source.asset() call in compute-stack.ts needs its
      # directory to actually exist on disk at synth time, same as a real `cdk deploy`
      # (confirmed by a real destroy failure: "CannotFindAsset" at .open-next/assets — this
      # workflow never ran the real OpenNext build at all). A real `npx open-next build`
      # would work too, but it's pointless cost for a stack that's about to be deleted —
      # these placeholders just need to exist, their content is irrelevant.
      - name: Create placeholder OpenNext assets (real build is unnecessary for a destroy)
        run: |
          mkdir -p .open-next/assets .open-next/server-functions/default \
            .open-next/image-optimization-function .open-next/revalidation-function \
            .open-next/dynamodb-provider
          for dir in .open-next/assets .open-next/server-functions/default \
            .open-next/image-optimization-function .open-next/revalidation-function \
            .open-next/dynamodb-provider; do
            echo "// placeholder — this stack is being destroyed" > "$dir/index.js"
          done

      - name: Destroy the PR's compute stack only — never --all, never the data stack
        working-directory: ./cdk
        env:
          # compute-stack.ts's constructor throws if this is unset (see its own
          # ledgerKmsKeyArn comment) — cdk/bin/app.ts unconditionally constructs it for
          # STACK_KIND=compute, so `cdk destroy` needs this just as much as `cdk deploy`
          # does. Missing here for a real stretch of this workflow's history: every PR-close
          # teardown failed before `cdk destroy` ever ran, silently leaving every closed
          # PR's compute stack (and its cost) alive — see pr-deploy-aws.yml's own use of
          # this same value, staging's real ledger KMS key (nothing here depends on it
          # matching what the stack was originally deployed with, same as the two SSM-
          # fetched secrets above).
          LEDGER_KMS_KEY_ARN: arn:aws:kms:us-east-1:919927637684:key/91672c29-e32c-4524-ad2d-b9b2b2b1ef92
        run: npx aws-cdk destroy "${STACK_ID}-compute-stack" --force --exclusively

      - name: Verify the stack is actually gone
        run: |
          FULL_STACK="${STACK_ID}-compute-stack"
          # A successful `cdk destroy` can leave describe-stacks briefly inconsistent —
          # confirmed by a real run where this printed the literal string "None" (an empty
          # --query result rendered as text, not an error) for a stack that a follow-up
          # describe-stacks call moments later correctly reported as gone. Retry a few
          # times before treating it as a real failure.
          STATUS="None"
          for attempt in 1 2 3 4 5; do
            STATUS=$(aws cloudformation describe-stacks --stack-name "$FULL_STACK" \
              --query 'Stacks[0].StackStatus' --output text 2>&1 || echo "DOES_NOT_EXIST")
            if [[ "$STATUS" != "None" ]]; then break; fi
            sleep 5
          done

          if [[ "$STATUS" == "DOES_NOT_EXIST" || "$STATUS" == "None" || "$STATUS" == *"does not exist"* ]]; then
            echo "✓ Stack $FULL_STACK: deleted"
          elif [ "$STATUS" = "DELETE_IN_PROGRESS" ]; then
            echo "Stack $FULL_STACK still deleting — waiting up to 20min..."
            aws cloudformation wait stack-delete-complete --stack-name "$FULL_STACK" --cli-read-timeout 1200
            echo "✓ Stack $FULL_STACK: deleted after waiting"
          else
            echo "::error::Stack $FULL_STACK is still in status '$STATUS' after destroy — not clean."
            aws cloudformation describe-stack-events --stack-name "$FULL_STACK" \
              --query 'StackEvents[?ResourceStatus==`DELETE_FAILED`].[LogicalResourceId,ResourceStatusReason]' \
              --output table 2>/dev/null || true
            exit 1
          fi

      - name: Clean orphaned IAM roles left over from this PR (if any)
        run: |
          PR_PATTERN="pr-${PR_NUMBER}-plexo"
          ORPHANED=$(aws iam list-roles \
            --query "Roles[?starts_with(RoleName, \`${PR_PATTERN}\`)].RoleName" \
            --output text 2>/dev/null || echo "")

          if [ -z "$ORPHANED" ]; then
            echo "✓ No orphaned IAM roles found for this PR"
            exit 0
          fi

          for ROLE in $ORPHANED; do
            echo "Cleaning up orphaned role: $ROLE"
            for POLICY in $(aws iam list-attached-role-policies --role-name "$ROLE" --query 'AttachedPolicies[].PolicyArn' --output text 2>/dev/null); do
              aws iam detach-role-policy --role-name "$ROLE" --policy-arn "$POLICY" || true
            done
            for POLICY in $(aws iam list-role-policies --role-name "$ROLE" --query 'PolicyNames' --output text 2>/dev/null); do
              aws iam delete-role-policy --role-name "$ROLE" --policy-name "$POLICY" || true
            done
            aws iam delete-role --role-name "$ROLE" && echo "  ✓ Deleted $ROLE" || echo "::warning::Could not delete $ROLE"
          done
