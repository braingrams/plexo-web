name: Deploy | Production

# Fires on every push to `main` — which only ever happens via a reviewed, approved PR
# merge (branch protection on `main` requires 1 approval + a passing `typecheck` check
# before a merge is even allowed — see the repo's branch protection settings). That
# review, not a second gate here, is the manual checkpoint before anything reaches real
# customers: GitHub's per-environment "required reviewers" protection rule (a second,
# deploy-time approval step) needs a paid plan this org's plan doesn't have (confirmed by
# a real 422 attempting to configure it), so this is the closest equivalent without one.
# `environment: production` is kept for its own sake (scopes any environment-specific
# secrets/variables, shows up in the repo's Deployments tab) even without that rule.

# workflow_dispatch covers redeploys with no code change — e.g. after rotating a secret
# in SSM, which needs a fresh deploy to actually take effect (see ORIGIN_VERIFY_SECRET/
# CRON_SECRET's own comments in cdk/lib/compute-stack.ts: they're baked in as literal
# Lambda env vars at deploy time, not loaded at runtime). Deliberately NOT gated the same
# way push-to-main is (branch protection) — this dispatches whatever's already on `main`,
# it can't introduce unreviewed code, only redeploy code that already passed that gate.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC — no static AWS keys anywhere in this workflow
  contents: read

jobs:
  deploy:
    if: github.repository == 'Challaris/plexo-web'
    runs-on: ubuntu-latest
    environment: production
    env:
      STACK_ID: production-plexo
      PLEXO_ENV: production
      AWS_ACCOUNT_ID: "919927637684"
      AWS_REGION: us-east-1

    steps:
      # fetch-depth: 2 — needed to diff against the pre-merge commit below (github.event.
      # before) to decide whether published-sites-stack actually needs a deploy.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::919927637684:role/github-actions-plexo-deploy
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      # Speeds up `next build`'s incremental compilation — a cache MISS still produces a
      # correct build (this is a performance cache, not a correctness dependency), just
      # slower, same as a fresh checkout always was before this existed.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-production-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-production-${{ hashFiles('package-lock.json') }}-
            nextjs-production-

      - name: Install app dependencies
        run: npm ci

      # See deploy-staging.yml's own matching comment on why published-sites-stack (unlike
      # compute-stack) is safe to skip when none of its real inputs changed.
      - name: Check whether published-sites-stack needs a deploy
        id: published_sites_diff
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch — always redeploying published-sites-stack"
          elif git diff --quiet "${{ github.event.before }}" "${{ github.sha }}" -- cdk/lib/published-sites-stack.ts cdk/lib/conventions.ts cdk/lib/forward-host-function.js cdk/bin/app.ts .github/workflows/deploy-production.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes — skipping published-sites-stack deploy"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub's "production" Environment secrets are the source of truth for everything
      # lib/ssmEnv.ts loads at runtime — change a value here in GitHub, push (via a
      # reviewed PR merge), and this step lands it in SSM before the deploy below ever
      # runs, so the next cold start picks it up. Previously SSM itself was the only
      # source of truth, updated by hand via the AWS CLI or the separate, manually-
      # triggered sync-secrets-to-ssm.yml — this folds that same sync into every deploy
      # instead of requiring a second step.
      - name: Sync secrets from GitHub to SSM
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
          CHARISOL_USER_POOL_ID: ${{ secrets.CHARISOL_USER_POOL_ID }}
          AI_KEY_ENCRYPTION_SECRET: ${{ secrets.AI_KEY_ENCRYPTION_SECRET }}
          PAYSTACK_KEY_ENCRYPTION_SECRET: ${{ secrets.PAYSTACK_KEY_ENCRYPTION_SECRET }}
          COMMERCE_DIGITAL_ACCESS_ENCRYPTION_SECRET: ${{ secrets.COMMERCE_DIGITAL_ACCESS_ENCRYPTION_SECRET }}
          BANK_DETAILS_ENCRYPTION_SECRET: ${{ secrets.BANK_DETAILS_ENCRYPTION_SECRET }}
          MAILDRIP_KEY_ENCRYPTION_SECRET: ${{ secrets.MAILDRIP_KEY_ENCRYPTION_SECRET }}
          MAILDRIP_API_URL: ${{ secrets.MAILDRIP_API_URL }}
          MAILDRIP_API_KEY: ${{ secrets.MAILDRIP_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PLATFORM_COMMERCE_STRIPE_SECRET_KEY: ${{ secrets.PLATFORM_COMMERCE_STRIPE_SECRET_KEY }}
          PLATFORM_COMMERCE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PLATFORM_COMMERCE_STRIPE_PUBLISHABLE_KEY }}
          PLATFORM_COMMERCE_STRIPE_WEBHOOK_SECRET: ${{ secrets.PLATFORM_COMMERCE_STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_ULTRA: ${{ secrets.STRIPE_PRICE_ULTRA }}
          STRIPE_PRICE_TOPUP_SMALL: ${{ secrets.STRIPE_PRICE_TOPUP_SMALL }}
          STRIPE_PRICE_TOPUP_MEDIUM: ${{ secrets.STRIPE_PRICE_TOPUP_MEDIUM }}
          STRIPE_PRICE_TOPUP_LARGE: ${{ secrets.STRIPE_PRICE_TOPUP_LARGE }}
          SYSTEM_AI_PROVIDER: ${{ secrets.SYSTEM_AI_PROVIDER }}
          SYSTEM_AI_KEY_ANTHROPIC_CLAUDE: ${{ secrets.SYSTEM_AI_KEY_ANTHROPIC_CLAUDE }}
          SYSTEM_AI_KEY_OPENAI: ${{ secrets.SYSTEM_AI_KEY_OPENAI }}
          SYSTEM_AI_KEY_GOOGLE_GEMINI: ${{ secrets.SYSTEM_AI_KEY_GOOGLE_GEMINI }}
          PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
          PUSHER_KEY: ${{ secrets.PUSHER_KEY }}
          PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
          PUSHER_CLUSTER: ${{ secrets.PUSHER_CLUSTER }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PLEXO_ORIGIN_VERIFY_SECRET: ${{ secrets.PLEXO_ORIGIN_VERIFY_SECRET }}
        run: |
          for NAME in AUTH_SECRET GOOGLE_SAFE_BROWSING_API_KEY CHARISOL_USER_POOL_ID \
            AI_KEY_ENCRYPTION_SECRET PAYSTACK_KEY_ENCRYPTION_SECRET COMMERCE_DIGITAL_ACCESS_ENCRYPTION_SECRET \
            BANK_DETAILS_ENCRYPTION_SECRET \
            MAILDRIP_KEY_ENCRYPTION_SECRET MAILDRIP_API_URL MAILDRIP_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET \
            PLATFORM_COMMERCE_STRIPE_SECRET_KEY PLATFORM_COMMERCE_STRIPE_PUBLISHABLE_KEY PLATFORM_COMMERCE_STRIPE_WEBHOOK_SECRET \
            STRIPE_PRICE_PRO STRIPE_PRICE_ULTRA STRIPE_PRICE_TOPUP_SMALL STRIPE_PRICE_TOPUP_MEDIUM STRIPE_PRICE_TOPUP_LARGE \
            SYSTEM_AI_PROVIDER SYSTEM_AI_KEY_ANTHROPIC_CLAUDE SYSTEM_AI_KEY_OPENAI SYSTEM_AI_KEY_GOOGLE_GEMINI \
            PUSHER_APP_ID PUSHER_KEY PUSHER_SECRET PUSHER_CLUSTER BROWSERBASE_API_KEY PEXELS_KEY PIXABAY_KEY UNSPLASH_KEY \
            CRON_SECRET PLEXO_ORIGIN_VERIFY_SECRET; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              echo "::warning::$NAME is not set in the production GitHub Environment — skipping, leaving SSM value unchanged"
              continue
            fi
            aws ssm put-parameter --name "/plexo/production/${NAME}" --value "$VALUE" --type SecureString --key-id "alias/aws/ssm" --overwrite --region us-east-1 > /dev/null
          done
          echo "✓ Synced secrets to /plexo/production/*"

      # `::add-mask::` BEFORE writing to $GITHUB_ENV — without it these values print in
      # plaintext in this step's own log (confirmed by a real run: both secrets appeared
      # unmasked in the "##[endgroup]" env dump every later step logs). $GITHUB_ENV only
      # makes a value available to subsequent steps; it does not register it as a secret
      # to redact from output.
      - name: Fetch build-time secrets from SSM
        run: |
          AUTH_SECRET="$(aws ssm get-parameter --name /plexo/production/AUTH_SECRET --with-decryption --query Parameter.Value --output text)"
          ORIGIN_VERIFY_SECRET="$(aws ssm get-parameter --name /plexo/production/PLEXO_ORIGIN_VERIFY_SECRET --with-decryption --query Parameter.Value --output text)"
          CRON_SECRET="$(aws ssm get-parameter --name /plexo/production/CRON_SECRET --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$AUTH_SECRET"
          echo "::add-mask::$ORIGIN_VERIFY_SECRET"
          echo "::add-mask::$CRON_SECRET"
          echo "AUTH_SECRET=$AUTH_SECRET" >> "$GITHUB_ENV"
          echo "ORIGIN_VERIFY_SECRET=$ORIGIN_VERIFY_SECRET" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"

      - name: Build the app (OpenNext)
        env:
          NEXT_PUBLIC_APP_URL: https://plexo.charisol.io
          NEXT_PUBLIC_PAGES_DOMAIN: plexopages.com
          # Charisol/Cognito-issued client ID (Developer Portal) — a public PKCE client ID,
          # not a secret (it's already inlined into the browser bundle either way), so it's
          # hardcoded here rather than round-tripped through SSM like the real secrets above.
          # Must be set here explicitly: NEXT_PUBLIC_ vars are baked into the client bundle
          # at `next build` time, not read at Lambda runtime, so lib/ssmEnv.ts's backfill
          # mechanism (which CHARISOL_USER_POOL_ID below does use) can't reach this one.
          NEXT_PUBLIC_CHARISOL_CLIENT_ID: 2rpia2i7sa1ns9pa1hncs2od3a
          NEXT_PUBLIC_CHARISOL_DOMAIN: auth.charisol.io
          # Baked into the client bundle at build time (NEXT_PUBLIC_), same reason
          # NEXT_PUBLIC_CHARISOL_CLIENT_ID above is hardcoded here rather than round-tripped
          # through SSM — a Stripe publishable key is meant to be public (embedded in every
          # page's own client-side JS), not a secret; lib/stripeClientPromise.ts reads this
          # to mount Plexo's own platform billing checkout (plan upgrades/credit top-ups),
          # a separate integration from PLATFORM_COMMERCE_STRIPE_PUBLISHABLE_KEY above
          # (that one powers Commerce storefronts using Plexo-hosted Stripe — same Stripe
          # account, but read server-side at runtime instead of baked in here).
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_live_51Kt77BDdgt0vAbTGxu4JeN6sEKVHpqLOtu1AfArhSSzKbIloDG5styjahzWm8SxfjU4eUBgRhElPoJIipM1vC0wC00k71SetKb
          # Pusher's "key" (unlike "secret") is the public one, meant to be embedded
          # client-side — same trust model as the Stripe publishable key just above, not a
          # secret despite living in the same GitHub secret store as PUSHER_SECRET.
          # Baked in at build time (NEXT_PUBLIC_) for lib/realtime/pusherClient.ts's
          # getPusherClient() — was never wired here before, so it always silently returned
          # null in every real deployment (comments AND notifications both fell back to
          # polling/no-realtime, regardless of the server-side PUSHER_* secrets already
          # being configured and firing events nobody was subscribed to receive).
          NEXT_PUBLIC_PUSHER_KEY: ${{ secrets.PUSHER_KEY }}
          NEXT_PUBLIC_PUSHER_CLUSTER: ${{ secrets.PUSHER_CLUSTER }}
          # lib/db/client.ts now throws if these are missing (outside next build) — but
          # `next build` itself DOES touch DynamoDB for a handful of statically-generated
          # routes (/sitemap.xml, /robots.txt, the blog sitemap/feed routes), so the build
          # step needs real values too, not just the deployed Lambda's own runtime env
          # (compute-stack.ts's tableEnv, injected separately at deploy time). Production's
          # own bare names — same ones nameFor() resolves to when isProd is true.
          PLEXO_CORE_TABLE: plexo-core
          PLEXO_LEDGER_TABLE: plexo-ledger
          PLEXO_COMMERCE_TABLE: plexo-commerce
          PLEXO_CONTENT_TABLE: plexo-content
          PLEXO_OPS_TABLE: plexo-ops
          PLEXO_IMPORT_TABLE: plexo-import
        run: npx open-next build

      - name: Install CDK project
        working-directory: ./cdk
        run: npm install

      - name: Deploy the compute stack
        working-directory: ./cdk
        env:
          STACK_KIND: compute
          APP_DOMAIN: plexo.charisol.io
          # compute-stack.ts bakes these directly into ServerFn's environment (optional —
          # see its own comment on why this doesn't throw like AUTH_SECRET/etc. do). Never
          # actually reached the deployed Lambda before this — see deploy-staging.yml's
          # matching comment for the full story.
          SYSTEM_AI_PROVIDER: ${{ secrets.SYSTEM_AI_PROVIDER }}
          SYSTEM_AI_KEY_ANTHROPIC_CLAUDE: ${{ secrets.SYSTEM_AI_KEY_ANTHROPIC_CLAUDE }}
          SYSTEM_AI_KEY_OPENAI: ${{ secrets.SYSTEM_AI_KEY_OPENAI }}
          SYSTEM_AI_KEY_GOOGLE_GEMINI: ${{ secrets.SYSTEM_AI_KEY_GOOGLE_GEMINI }}
          # The real key/ ARN of plexo-ledger's customer-managed KMS key, NOT its alias
          # ARN — see compute-stack.ts's own ledgerKmsKeyArn comment for why an alias ARN
          # silently fails to authorize the kms:Decrypt calls DynamoDB actually makes.
          LEDGER_KMS_KEY_ARN: arn:aws:kms:us-east-1:919927637684:key/1b1244bc-13ee-4cd3-837e-2c6002cf8a85
          # Cache-busting suffix baked into every published storefront's commerce.js
          # <script src> — see compute-stack.ts's own assetVersion comment. github.sha
          # changes on every deploy, which is exactly what's needed here.
          ASSET_VERSION: ${{ github.sha }}
        run: npx aws-cdk deploy "${STACK_ID}-compute-stack" --require-approval never --exclusively

      - name: Deploy the published-sites stack
        if: steps.published_sites_diff.outputs.changed == 'true'
        working-directory: ./cdk
        env:
          STACK_KIND: published-sites
          WILDCARD_DOMAIN: plexopages.com
          # Fixed forever (see published-sites-stack.ts's own comment) — captured from
          # what's already live on this distribution. Must never change even if
          # WILDCARD_DOMAIN itself ever does — see the real deploy failure that
          # necessitated this on staging.
          PRIMARY_DISTRIBUTION_CERT_ARN: arn:aws:acm:us-east-1:919927637684:certificate/0c7258c0-532d-45b2-90ae-16458501f83a
          APP_URL: https://plexo.charisol.io
        run: npx aws-cdk deploy "${STACK_ID}-published-sites-stack" --require-approval never --exclusively

      # Belt-and-suspenders alongside the shorter origin Cache-Control DeployCommerceJs
      # now sets (compute-stack.ts) and the ?v=<sha> cache-busting query param
      # (injectCommerceScript) — this makes the fix take effect at THIS distribution's
      # edge immediately, instead of waiting up to a minute for the new short max-age to
      # lapse. Reads the distribution ID from published-sites-stack's own CfnOutput
      # rather than hardcoding it, since it's a physical ID CloudFormation assigns.
      # continue-on-error: this role's exact IAM permissions outside of `cdk deploy`
      # itself (which may chain through a separate CDK bootstrap role) aren't verified —
      # if describe-stacks/create-invalidation aren't granted directly to it, this step
      # failing must not fail the whole deploy or skip the smoke test below. The short
      # Cache-Control on commerce.js (60s) and the ?v=<sha> query param are the real,
      # load-bearing fix; this step only shaves that 60s window off.
      - name: Invalidate CloudFront cache for commerce.js
        working-directory: ./cdk
        continue-on-error: true
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_ID}-published-sites-stack" \
            --query "Stacks[0].Outputs[?OutputKey=='PrimaryDistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/commerce.js"

      - name: Smoke test — dashboard responds
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://plexo.charisol.io/)
          if [ "$STATUS" != "200" ]; then
            echo "::error::Dashboard returned HTTP $STATUS after deploy"
            exit 1
          fi
          echo "✓ Dashboard responded 200"
