name: Deploy | Staging

# Fires on every push to `staging` — builds the app and deploys BOTH the compute stack
# (dashboard + tenant Lambdas) and the published-sites stack (the CloudFront SaaS Manager
# distribution + the certificate-attachment EventBridge schedule) to the real, persistent
# staging environment. No manual gate: staging exists specifically so this is safe to do
# on every push. workflow_dispatch covers redeploys with no code change — e.g. after
# rotating a secret in SSM, which needs a fresh deploy to actually take effect (see
# ORIGIN_VERIFY_SECRET/CRON_SECRET's own comments in cdk/lib/compute-stack.ts: they're
# baked in as literal Lambda env vars at deploy time, not loaded at runtime).

on:
  push:
    branches:
      - staging
  workflow_dispatch:

permissions:
  id-token: write # required for OIDC — no static AWS keys anywhere in this workflow
  contents: read

jobs:
  deploy:
    if: github.repository == 'Challaris/plexo-web'
    runs-on: ubuntu-latest
    environment: staging
    env:
      STACK_ID: staging-plexo
      PLEXO_ENV: staging
      AWS_ACCOUNT_ID: "919927637684"
      AWS_REGION: us-east-1

    steps:
      # fetch-depth: 2 — needed to diff against the pre-push commit below (github.event.
      # before) to decide whether published-sites-stack actually needs a deploy.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::919927637684:role/github-actions-plexo-deploy
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      # Speeds up `next build`'s incremental compilation — a cache MISS still produces a
      # correct build (this is a performance cache, not a correctness dependency), just
      # slower, same as a fresh checkout always was before this existed.
      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-staging-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

      - name: Install app dependencies
        run: npm ci

      # published-sites-stack.ts has no reference to this app's own Lambda code (it
      # cross-imports compute-stack's ARNs, never rebuilds them) — its only real inputs are
      # its own source file, the shared conventions/forward-host-function files, bin/app.ts,
      # and this workflow's own hardcoded env values for that step. When none of those
      # changed since the last push, `cdk deploy` would find zero diff anyway; skipping it
      # outright saves the ~1-2 minutes CDK still spends synthesizing + diffing to reach
      # that same "no changes" conclusion. compute-stack, by contrast, is NOT skippable this
      # way — its Lambda code asset hash changes on nearly every push regardless of which
      # files changed, since OpenNext re-bundles the whole app each time.
      - name: Check whether published-sites-stack needs a deploy
        id: published_sites_diff
        # Compared against the commit this stack was last deployed from (recorded in SSM
        # after each successful deploy below) — not the previous push, which skipped the
        # stack whenever the push that changed it had failed before reaching this step.
        # Anything unknown (first run, missing commit) deploys.
        run: |
          PATHS="cdk/lib/published-sites-stack.ts cdk/lib/conventions.ts cdk/lib/forward-host-function.js cdk/bin/app.ts .github/workflows/deploy-staging.yml"
          LAST=$(aws ssm get-parameter --name "/plexo/staging/PUBLISHED_SITES_DEPLOYED_SHA" --query Parameter.Value --output text --region us-east-1 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "workflow_dispatch — always redeploying published-sites-stack"
          elif [ -z "$LAST" ] || [ "$LAST" = "None" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "No record of the last published-sites deploy — deploying"
          elif git fetch --quiet --depth=1 origin "$LAST" && git diff --quiet "$LAST" "${{ github.sha }}" -- $PATHS; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed since the last published-sites deploy ($LAST) — skipping"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # GitHub's "staging" Environment secrets are the source of truth for everything
      # lib/ssmEnv.ts loads at runtime — change a value here in GitHub, push, and this
      # step lands it in SSM before the deploy below ever runs, so the next cold start
      # picks it up. Previously SSM itself was the only source of truth, updated by hand
      # via the AWS CLI or the separate, manually-triggered sync-secrets-to-ssm.yml — this
      # folds that same sync into every deploy instead of requiring a second step.
      - name: Sync secrets from GitHub to SSM
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          GOOGLE_SAFE_BROWSING_API_KEY: ${{ secrets.GOOGLE_SAFE_BROWSING_API_KEY }}
          CHARISOL_USER_POOL_ID: ${{ secrets.CHARISOL_USER_POOL_ID }}
          AI_KEY_ENCRYPTION_SECRET: ${{ secrets.AI_KEY_ENCRYPTION_SECRET }}
          PAYSTACK_KEY_ENCRYPTION_SECRET: ${{ secrets.PAYSTACK_KEY_ENCRYPTION_SECRET }}
          COMMERCE_DIGITAL_ACCESS_ENCRYPTION_SECRET: ${{ secrets.COMMERCE_DIGITAL_ACCESS_ENCRYPTION_SECRET }}
          BANK_DETAILS_ENCRYPTION_SECRET: ${{ secrets.BANK_DETAILS_ENCRYPTION_SECRET }}
          MAILDRIP_KEY_ENCRYPTION_SECRET: ${{ secrets.MAILDRIP_KEY_ENCRYPTION_SECRET }}
          APP_SECRETS_ENCRYPTION_SECRET: ${{ secrets.APP_SECRETS_ENCRYPTION_SECRET }}
          STRATA_TOKEN_ENCRYPTION_SECRET: ${{ secrets.STRATA_TOKEN_ENCRYPTION_SECRET }}
          STRATA_API_URL: ${{ secrets.STRATA_API_URL }}
          CHARISOL_TRUSTED_CLIENT_IDS: ${{ secrets.CHARISOL_TRUSTED_CLIENT_IDS }}
          PLEXO_GITHUB_APP_ID: ${{ secrets.PLEXO_GITHUB_APP_ID }}
          PLEXO_GITHUB_APP_SLUG: ${{ secrets.PLEXO_GITHUB_APP_SLUG }}
          PLEXO_GITHUB_APP_PRIVATE_KEY: ${{ secrets.PLEXO_GITHUB_APP_PRIVATE_KEY }}
          PLEXO_GITHUB_APP_WEBHOOK_SECRET: ${{ secrets.PLEXO_GITHUB_APP_WEBHOOK_SECRET }}
          PLEXO_GITHUB_APP_CLIENT_ID: ${{ secrets.PLEXO_GITHUB_APP_CLIENT_ID }}
          PLEXO_GITHUB_APP_CLIENT_SECRET: ${{ secrets.PLEXO_GITHUB_APP_CLIENT_SECRET }}
          MAILDRIP_API_URL: ${{ secrets.MAILDRIP_API_URL }}
          MAILDRIP_API_KEY: ${{ secrets.MAILDRIP_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PLATFORM_COMMERCE_STRIPE_SECRET_KEY: ${{ secrets.PLATFORM_COMMERCE_STRIPE_SECRET_KEY }}
          PLATFORM_COMMERCE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.PLATFORM_COMMERCE_STRIPE_PUBLISHABLE_KEY }}
          PLATFORM_COMMERCE_STRIPE_WEBHOOK_SECRET: ${{ secrets.PLATFORM_COMMERCE_STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_PRO: ${{ secrets.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_ULTRA: ${{ secrets.STRIPE_PRICE_ULTRA }}
          STRIPE_PRICE_TOPUP_SMALL: ${{ secrets.STRIPE_PRICE_TOPUP_SMALL }}
          STRIPE_PRICE_TOPUP_MEDIUM: ${{ secrets.STRIPE_PRICE_TOPUP_MEDIUM }}
          STRIPE_PRICE_TOPUP_LARGE: ${{ secrets.STRIPE_PRICE_TOPUP_LARGE }}
          SYSTEM_AI_PROVIDER: ${{ secrets.SYSTEM_AI_PROVIDER }}
          SYSTEM_AI_KEY_ANTHROPIC_CLAUDE: ${{ secrets.SYSTEM_AI_KEY_ANTHROPIC_CLAUDE }}
          SYSTEM_AI_KEY_OPENAI: ${{ secrets.SYSTEM_AI_KEY_OPENAI }}
          SYSTEM_AI_KEY_GOOGLE_GEMINI: ${{ secrets.SYSTEM_AI_KEY_GOOGLE_GEMINI }}
          PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
          PUSHER_KEY: ${{ secrets.PUSHER_KEY }}
          PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
          PUSHER_CLUSTER: ${{ secrets.PUSHER_CLUSTER }}
          BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
          PEXELS_KEY: ${{ secrets.PEXELS_KEY }}
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PLEXO_ORIGIN_VERIFY_SECRET: ${{ secrets.PLEXO_ORIGIN_VERIFY_SECRET }}
          ALPS_API_KEY: ${{ secrets.ALPS_API_KEY }}
          ALPS_LEAD_STAGE: ${{ secrets.ALPS_LEAD_STAGE }}
          ALPS_CUSTOMER_STAGE: ${{ secrets.ALPS_CUSTOMER_STAGE }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_APP_SECRET: ${{ secrets.WHATSAPP_APP_SECRET }}
          WHATSAPP_VERIFY_TOKEN: ${{ secrets.WHATSAPP_VERIFY_TOKEN }}
          WHATSAPP_BUSINESS_NUMBER: ${{ secrets.WHATSAPP_BUSINESS_NUMBER }}
          WHATSAPP_GRAPH_VERSION: ${{ secrets.WHATSAPP_GRAPH_VERSION }}
        run: |
          for NAME in AUTH_SECRET GOOGLE_SAFE_BROWSING_API_KEY CHARISOL_USER_POOL_ID \
            AI_KEY_ENCRYPTION_SECRET PAYSTACK_KEY_ENCRYPTION_SECRET COMMERCE_DIGITAL_ACCESS_ENCRYPTION_SECRET \
            BANK_DETAILS_ENCRYPTION_SECRET \
            MAILDRIP_KEY_ENCRYPTION_SECRET APP_SECRETS_ENCRYPTION_SECRET STRATA_TOKEN_ENCRYPTION_SECRET STRATA_API_URL CHARISOL_TRUSTED_CLIENT_IDS PLEXO_GITHUB_APP_ID PLEXO_GITHUB_APP_SLUG PLEXO_GITHUB_APP_PRIVATE_KEY PLEXO_GITHUB_APP_WEBHOOK_SECRET PLEXO_GITHUB_APP_CLIENT_ID PLEXO_GITHUB_APP_CLIENT_SECRET MAILDRIP_API_URL MAILDRIP_API_KEY STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET \
            PLATFORM_COMMERCE_STRIPE_SECRET_KEY PLATFORM_COMMERCE_STRIPE_PUBLISHABLE_KEY PLATFORM_COMMERCE_STRIPE_WEBHOOK_SECRET \
            STRIPE_PRICE_PRO STRIPE_PRICE_ULTRA STRIPE_PRICE_TOPUP_SMALL STRIPE_PRICE_TOPUP_MEDIUM STRIPE_PRICE_TOPUP_LARGE \
            SYSTEM_AI_PROVIDER SYSTEM_AI_KEY_ANTHROPIC_CLAUDE SYSTEM_AI_KEY_OPENAI SYSTEM_AI_KEY_GOOGLE_GEMINI \
            PUSHER_APP_ID PUSHER_KEY PUSHER_SECRET PUSHER_CLUSTER BROWSERBASE_API_KEY PEXELS_KEY PIXABAY_KEY UNSPLASH_KEY \
            CRON_SECRET PLEXO_ORIGIN_VERIFY_SECRET ALPS_API_KEY ALPS_LEAD_STAGE ALPS_CUSTOMER_STAGE \
            WHATSAPP_ACCESS_TOKEN WHATSAPP_PHONE_NUMBER_ID WHATSAPP_APP_SECRET WHATSAPP_VERIFY_TOKEN WHATSAPP_BUSINESS_NUMBER WHATSAPP_GRAPH_VERSION; do
            VALUE="${!NAME}"
            if [ -z "$VALUE" ]; then
              echo "::warning::$NAME is not set in the staging GitHub Environment — skipping, leaving SSM value unchanged"
              continue
            fi
            aws ssm put-parameter --name "/plexo/staging/${NAME}" --value "$VALUE" --type SecureString --key-id "alias/aws/ssm" --overwrite --region us-east-1 > /dev/null
          done
          echo "✓ Synced secrets to /plexo/staging/*"

      # AUTH_SECRET is needed at build time too (Auth.js's own NextAuth() config throws
      # without it in production mode) — see lib/ssmEnv.ts's own comment on why this
      # can't just be read at runtime alone for every value (that mechanism silently
      # never ran at all until this exact bug was found and fixed this same day).
      # `::add-mask::` BEFORE writing to $GITHUB_ENV — without it these values print in
      # plaintext in this step's own log (confirmed by a real run: both secrets appeared
      # unmasked in the "##[endgroup]" env dump every later step logs). $GITHUB_ENV only
      # makes a value available to subsequent steps; it does not register it as a secret
      # to redact from output.
      - name: Fetch build-time secrets from SSM
        run: |
          AUTH_SECRET="$(aws ssm get-parameter --name /plexo/staging/AUTH_SECRET --with-decryption --query Parameter.Value --output text)"
          ORIGIN_VERIFY_SECRET="$(aws ssm get-parameter --name /plexo/staging/PLEXO_ORIGIN_VERIFY_SECRET --with-decryption --query Parameter.Value --output text)"
          CRON_SECRET="$(aws ssm get-parameter --name /plexo/staging/CRON_SECRET --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$AUTH_SECRET"
          echo "::add-mask::$ORIGIN_VERIFY_SECRET"
          echo "::add-mask::$CRON_SECRET"
          echo "AUTH_SECRET=$AUTH_SECRET" >> "$GITHUB_ENV"
          echo "ORIGIN_VERIFY_SECRET=$ORIGIN_VERIFY_SECRET" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"

      - name: Build the app (OpenNext)
        env:
          # staging-plexo.charisol.io's redirect/logout URIs are already registered for
          # this Charisol app client in the Developer Portal — confirmed before this
          # cutover, not assumed.
          NEXT_PUBLIC_APP_URL: https://staging-plexo.charisol.io
          NEXT_PUBLIC_PAGES_DOMAIN: staging-plexo.charisol.io
          NEXT_PUBLIC_CHARISOL_CLIENT_ID: 2rpia2i7sa1ns9pa1hncs2od3a
          NEXT_PUBLIC_CHARISOL_DOMAIN: auth.charisol.io
          # Baked into the client bundle at build time (NEXT_PUBLIC_) — see
          # deploy-production.yml's matching comment for the full reasoning. Test-mode key
          # (same Stripe account as production's live key).
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_51Kt77BDdgt0vAbTGFMtXDg2HBYLQkLIHsDklJ4kIoHHlkSL2b9w2UN6AcK6fHRMEfnsDDbcyv1Cf3qpfWhyrDcnz00Fw8EyrPN
          # See deploy-production.yml's matching comment — Pusher's "key" is the public one
          # by design, safe to bake in client-side the same way the Stripe publishable key
          # above is. Was never wired here before, so getPusherClient() always returned
          # null in every real deployment.
          NEXT_PUBLIC_PUSHER_KEY: ${{ secrets.PUSHER_KEY }}
          NEXT_PUBLIC_PUSHER_CLUSTER: ${{ secrets.PUSHER_CLUSTER }}
          # lib/db/client.ts now throws if these are missing (outside next build) — but
          # `next build` itself DOES touch DynamoDB for a handful of statically-generated
          # routes (/sitemap.xml, /robots.txt, the blog sitemap/feed routes), so the build
          # step needs real values too, not just the deployed Lambda's own runtime env
          # (compute-stack.ts's tableEnv, injected separately at deploy time). Before this
          # was added, those build-time queries silently fell back to the bare PRODUCTION
          # table names — staging's own sitemap generation has been reading prod's
          # plexo-content table this whole time. Same names cdk/lib/compute-stack.ts's
          # nameFor() resolves to for STACK_ID=staging-plexo.
          PLEXO_CORE_TABLE: plexo-core-staging-plexo
          PLEXO_LEDGER_TABLE: plexo-ledger-staging-plexo
          PLEXO_COMMERCE_TABLE: plexo-commerce-staging-plexo
          PLEXO_CONTENT_TABLE: plexo-content-staging-plexo
          PLEXO_OPS_TABLE: plexo-ops-staging-plexo
          PLEXO_IMPORT_TABLE: plexo-import-staging-plexo
        run: npx open-next build

      - name: Install CDK project
        working-directory: ./cdk
        run: npm install

      - name: Deploy the app-data stack
        # Databases for apps built on Plexo: Aurora Serverless v2 (auto-pauses to 0 ACU) +
        # AppDbFn (cdk/lib/app-data-stack.ts). A no-op when nothing in it changed; the very
        # first deploy creates the cluster (~10 minutes). Before compute, whose Lambdas
        # call it.
        working-directory: ./cdk
        env:
          STACK_KIND: app-data
        run: npx aws-cdk deploy "${STACK_ID}-app-data-stack" --require-approval never --exclusively

      - name: Deploy the compute stack
        working-directory: ./cdk
        env:
          # SolChatFn's own copy of the build-time NEXT_PUBLIC_ values (see compute-stack.ts's publicUrlEnv).
          NEXT_PUBLIC_APP_URL: https://staging-plexo.charisol.io
          NEXT_PUBLIC_PAGES_DOMAIN: staging-plexo.charisol.io
          STACK_KIND: compute
          # compute-stack.ts bakes these directly into ServerFn's environment (optional —
          # see its own comment on why this doesn't throw like AUTH_SECRET/etc. do above).
          # Previously only ever synced to SSM (the "Sync secrets from GitHub to SSM" step
          # above), never actually reaching the deployed Lambda — the runtime SSM-loading
          # path (lib/ssmEnv.ts) has never actually run in any real deploy (see that gap's
          # own comment in compute-stack.ts), so System AI has been silently unconfigured
          # in every environment until this was added.
          SYSTEM_AI_PROVIDER: ${{ secrets.SYSTEM_AI_PROVIDER }}
          SYSTEM_AI_KEY_ANTHROPIC_CLAUDE: ${{ secrets.SYSTEM_AI_KEY_ANTHROPIC_CLAUDE }}
          SYSTEM_AI_KEY_OPENAI: ${{ secrets.SYSTEM_AI_KEY_OPENAI }}
          SYSTEM_AI_KEY_GOOGLE_GEMINI: ${{ secrets.SYSTEM_AI_KEY_GOOGLE_GEMINI }}
          # Registers staging-plexo.charisol.io on the distribution (so it's ready to
          # accept traffic once DNS points there) without yet changing what the app
          # itself thinks its own URL is (NEXT_PUBLIC_APP_URL, below, stays on the bare
          # *.cloudfront.net domain until the real routing CNAME — not just the ACM
          # validation one — is confirmed live, to avoid a window where the app's
          # self-perceived origin doesn't match where it's actually reachable).
          APP_DOMAIN: staging-plexo.charisol.io
          APP_CERT_ARN: arn:aws:acm:us-east-1:919927637684:certificate/22886607-0c7c-456b-8449-4794898fcfa9
          # The real key/ ARN of plexo-ledger's customer-managed KMS key, NOT its alias
          # ARN — see compute-stack.ts's own ledgerKmsKeyArn comment for why an alias ARN
          # silently fails to authorize the kms:Decrypt calls DynamoDB actually makes.
          LEDGER_KMS_KEY_ARN: arn:aws:kms:us-east-1:919927637684:key/91672c29-e32c-4524-ad2d-b9b2b2b1ef92
          # Cache-busting suffix baked into every published storefront's commerce.js
          # <script src> — see compute-stack.ts's own assetVersion comment. github.sha
          # changes on every deploy, which is exactly what's needed here.
          ASSET_VERSION: ${{ github.sha }}
        run: npx aws-cdk deploy "${STACK_ID}-compute-stack" --require-approval never --exclusively

      - name: Deploy the published-sites stack
        if: steps.published_sites_diff.outputs.changed == 'true'
        working-directory: ./cdk
        env:
          STACK_KIND: published-sites
          # Replaces plexo.aws.charisol.io as staging's real published-sites wildcard —
          # charisol.io's DNS lives on Cloudflare (manual CNAME, no WILDCARD_ZONE_ID/NAME
          # needed here, unlike plexo.aws.charisol.io's own Route53-hosted zone).
          WILDCARD_DOMAIN: staging-plexo.charisol.io
          WILDCARD_CERT_ARN: arn:aws:acm:us-east-1:919927637684:certificate/6c17fa15-95ef-4efc-a95f-2d1dad8fcbc8
          # Fixed forever (see published-sites-stack.ts's own comment) — captured from
          # what was already live on this exact distribution before this migration ever
          # touched WILDCARD_DOMAIN/WILDCARD_CERT_ARN above.
          PRIMARY_DISTRIBUTION_CERT_ARN: arn:aws:acm:us-east-1:919927637684:certificate/841223fd-8978-4046-bc57-d58cd402b62d
          # staging-plexo.charisol.io's bare apex is the dashboard's OWN domain (see the
          # compute-stack deploy step's APP_DOMAIN above) — the wildcard tenant below must
          # NOT also claim it (confirmed by a real deploy failure: CloudFront enforces
          # domain uniqueness across every distribution/tenant in the account).
          INCLUDE_BARE_WILDCARD_DOMAIN: "false"
          APP_URL: https://d3i92fgfanqz2.cloudfront.net
        run: npx aws-cdk deploy "${STACK_ID}-published-sites-stack" --require-approval never --exclusively

      - name: Record the deployed published-sites commit
        if: steps.published_sites_diff.outputs.changed == 'true'
        run: aws ssm put-parameter --name "/plexo/staging/PUBLISHED_SITES_DEPLOYED_SHA" --value "${{ github.sha }}" --type String --overwrite --region us-east-1 > /dev/null

      # See deploy-production.yml's matching step for why this exists alongside the
      # shorter origin Cache-Control and the ?v=<sha> query param, and why it's
      # continue-on-error (this role's IAM permissions outside `cdk deploy` itself aren't
      # verified — a permissions gap here must not fail the deploy or skip the smoke test).
      #
      # Loops every distribution TENANT, not just the primary distribution — this
      # distribution runs connectionMode "tenant-only" (published-sites-stack.ts), so no
      # real visitor's traffic is ever served by the primary distribution's own cache at
      # all; every domain (the *.plexopages.com wildcard AND every custom domain) is
      # served through its own CfnDistributionTenant, each caching independently. The
      # plain create-invalidation call below only ever cleared the primary distribution —
      # confirmed live on yeshuahelimax.com (a custom domain): it kept serving a stale
      # commerce.js for hours after a deploy until its own dedicated tenant was found and
      # invalidated by hand (see create-invalidation-for-distribution-tenant, the
      # tenant-scoped equivalent — the plain command 404s as NoSuchDistribution against a
      # tenant ID). The distribution is multi-tenant, so the plain distribution-level call
      # always fails (NoSuchDistribution) — and under bash -e it used to end this step
      # before any tenant was invalidated. Only the per-tenant calls are made.
      - name: Invalidate CloudFront cache for commerce.js (every distribution tenant)
        working-directory: ./cdk
        continue-on-error: true
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "${STACK_ID}-published-sites-stack" \
            --query "Stacks[0].Outputs[?OutputKey=='PrimaryDistributionId'].OutputValue" \
            --output text)
          # Multi-tenant ("tenant-only") distributions reject a plain CreateInvalidation
          # (NoSuchDistribution), so invalidate each tenant instead.

          TENANT_IDS=$(aws cloudfront list-distribution-tenants \
            --association-filter DistributionId="$DISTRIBUTION_ID" \
            --query "DistributionTenantList[].Id" --output text)
          for TENANT_ID in $TENANT_IDS; do
            echo "Invalidating tenant $TENANT_ID"
            aws cloudfront create-invalidation-for-distribution-tenant \
              --id "$TENANT_ID" \
              --invalidation-batch "{\"Paths\":{\"Quantity\":1,\"Items\":[\"/commerce.js\"]},\"CallerReference\":\"gh-${{ github.run_id }}-${{ github.run_attempt }}-$TENANT_ID\"}" \
              || echo "::warning::Failed to invalidate distribution tenant $TENANT_ID"
          done

      # Checks staging-plexo.charisol.io directly, NOT the distribution's own
      # *.cloudfront.net domain — now that NEXT_PUBLIC_APP_URL is the custom domain,
      # middleware.ts's own tenant-vs-dashboard routing no longer recognizes the bare
      # CloudFront domain as "home" at all (confirmed by a real false-failure here: the
      # raw domain now 404s with the app's own "this landing page domain has not been
      # published" page, even though the real domain is healthy) — checking the actual
      # domain real traffic uses is both more accurate and no longer blocked on DNS
      # propagation, since the routing CNAME (not just the ACM validation one) is
      # confirmed permanently in place at this point.
      - name: Smoke test — dashboard responds
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://staging-plexo.charisol.io/")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Dashboard returned HTTP $STATUS after deploy"
            exit 1
          fi
          echo "✓ Dashboard responded 200"

      # Plan enforcement applies to every account right after a deploy — not only as each
      # one is next visited (lib/plan/sweep.ts). Idempotent; the hourly schedule finishes
      # anything this run doesn't. Never fails the deploy.
      - name: Apply plan lifecycle to every account
        continue-on-error: true
        run: |
          STATUS=$(curl -s -o /tmp/plan-sweep.json -w "%{http_code}" --max-time 90 \
            -H "x-cron-secret: $CRON_SECRET" "https://staging-plexo.charisol.io/api/internal/plan-lifecycle" || true)
          echo "Plan lifecycle sweep: HTTP $STATUS"
          cat /tmp/plan-sweep.json 2>/dev/null || true
