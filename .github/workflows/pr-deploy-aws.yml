name: PR | Deploy Compute Stack Preview

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  id-token: write # required for OIDC — no static AWS keys anywhere in this workflow
  contents: read
  pull-requests: write # required to post/update the preview-link PR comment below

jobs:
  deploy:
    if: github.repository == 'Challaris/plexo-web'
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.number }}
      STACK_ID: pr-${{ github.event.number }}-plexo
      STACK_KIND: compute
      PLEXO_ENV: staging
      AWS_ACCOUNT_ID: "919927637684"
      AWS_REGION: us-east-1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard — refuse to run against anything but a pr-<number>-plexo stack
        run: |
          if [[ ! "$STACK_ID" =~ ^pr-[0-9]+-plexo$ ]]; then
            echo "::error::STACK_ID '$STACK_ID' doesn't match the required pr-<number>-plexo pattern — refusing to deploy."
            exit 1
          fi

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::919927637684:role/github-actions-plexo-deploy
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install app dependencies
        run: npm ci

      # PR previews share staging's real DynamoDB tables (data-stack.ts is deployed once
      # for staging/production only — see cdk/bin/app.ts's own comment — a PR's own
      # STACK_ID has no tables of its own) and staging's own secrets (Google/Stripe/
      # Maildrip/Pusher/encryption keys, all real values in /plexo/staging/* by now),
      # loaded at runtime the same way staging's own deploy loads them (lib/ssmEnv.ts,
      # via instrumentation.ts) since PLEXO_ENV is "staging" here too. ORIGIN_VERIFY_SECRET
      # and CRON_SECRET are the two exceptions baked directly into the Lambda's own
      # environment (see compute-stack.ts's own comment on why) rather than loaded async,
      # so cdk deploy itself needs them as plain shell env vars — reusing staging's real
      # ones here rather than minting new ones with nothing to validate against.
      # `::add-mask::` BEFORE writing to $GITHUB_ENV — without it these values print in
      # plaintext in this step's own log (confirmed by a real run: both secrets appeared
      # unmasked in the "##[endgroup]" env dump every later step logs). $GITHUB_ENV only
      # makes a value available to subsequent steps; it does not register it as a secret
      # to redact from output.
      - name: Fetch staging's shared secrets for the build + deploy
        run: |
          AUTH_SECRET="$(aws ssm get-parameter --name /plexo/staging/AUTH_SECRET --with-decryption --query Parameter.Value --output text)"
          ORIGIN_VERIFY_SECRET="$(aws ssm get-parameter --name /plexo/staging/PLEXO_ORIGIN_VERIFY_SECRET --with-decryption --query Parameter.Value --output text)"
          CRON_SECRET="$(aws ssm get-parameter --name /plexo/staging/CRON_SECRET --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$AUTH_SECRET"
          echo "::add-mask::$ORIGIN_VERIFY_SECRET"
          echo "::add-mask::$CRON_SECRET"
          echo "AUTH_SECRET=$AUTH_SECRET" >> "$GITHUB_ENV"
          echo "ORIGIN_VERIFY_SECRET=$ORIGIN_VERIFY_SECRET" >> "$GITHUB_ENV"
          echo "CRON_SECRET=$CRON_SECRET" >> "$GITHUB_ENV"

      # No real domain exists for a PR preview before its first deploy (the CloudFront
      # domain is an OUTPUT of `cdk deploy`, not known beforehand) — NEXT_PUBLIC_* vars
      # are inlined into the JS bundle at build time either way, so this can only ever be
      # a placeholder for previews. See middleware.ts's own "http://localhost:3000"
      # fallback for the same constraint; harmless for reviewing app behavior in a
      # preview, only affects the credentialed-CORS allowlist for genuinely cross-origin
      # calls into this exact preview's own API, which previews don't exercise.
      - name: Build the app (OpenNext)
        env:
          PLEXO_ENV: staging
          NEXT_PUBLIC_PAGES_DOMAIN: plexo.aws.charisol.io
          # lib/db/client.ts now throws if these are missing (outside next build) — but
          # `next build` itself DOES touch DynamoDB for a handful of statically-generated
          # routes (/sitemap.xml, /robots.txt, the blog sitemap/feed routes). PR previews
          # share staging's real tables (same TABLE_STACK_ID: staging-plexo the actual CDK
          # deploy step below already uses), not their own.
          PLEXO_CORE_TABLE: plexo-core-staging-plexo
          PLEXO_LEDGER_TABLE: plexo-ledger-staging-plexo
          PLEXO_COMMERCE_TABLE: plexo-commerce-staging-plexo
          PLEXO_CONTENT_TABLE: plexo-content-staging-plexo
          PLEXO_OPS_TABLE: plexo-ops-staging-plexo
          PLEXO_IMPORT_TABLE: plexo-import-staging-plexo
        run: npx open-next build

      - name: Install & build CDK project
        working-directory: ./cdk
        run: npm install

      # CloudFront refuses to accept a NEW alias unless that hostname's DNS ALREADY
      # resolves correctly (confirmed by a real deploy failure: "includes an incorrectly
      # configured DNS record that points to another CloudFront distribution" — CloudFront
      # returns that same message whether the record points elsewhere OR doesn't exist at
      # all yet). A brand new PR's distribution domain is only known AFTER a deploy
      # succeeds, so the very first time this alias is attached is a real chicken-and-egg
      # problem. Deploying WITHOUT the custom domain first, then pointing DNS at whatever
      # bare *.cloudfront.net domain that produces, then deploying AGAIN with the domain
      # now that DNS resolves correctly, breaks the cycle — the second deploy is a fast
      # no-op update once DNS/alias are already correct (every push after the first).
      - name: Deploy the PR's compute stack (bare domain first)
        working-directory: ./cdk
        env:
          TABLE_STACK_ID: staging-plexo
          # PR previews share staging's data tables (TABLE_STACK_ID above), including its
          # plexo-ledger table and the customer-managed KMS key that guards it — so this
          # is staging's own key, not a per-PR one. See compute-stack.ts's own
          # ledgerKmsKeyArn comment for why this must be the real key/ ARN, not alias/.
          LEDGER_KMS_KEY_ARN: arn:aws:kms:us-east-1:919927637684:key/91672c29-e32c-4524-ad2d-b9b2b2b1ef92
        # --outputs-file gives the next step DistributionDomainName (compute-stack.ts's own
        # CfnOutput) without scraping cdk's human-oriented stdout.
        run: npx aws-cdk deploy "${STACK_ID}-compute-stack" --require-approval never --exclusively --outputs-file cdk-outputs.json

      # Points pr-<N>.plexo.aws.charisol.io at whatever real *.cloudfront.net domain the
      # bare deploy above produced. plexo.aws.charisol.io is a Route53 zone already owned
      # by this same AWS account (Z08127631OJ16MLNL9RH) — using it instead of Cloudflare
      # means this needs no separate DNS credential at all, just the same OIDC role already
      # assumed for the CDK deploy above. UPSERT is create-or-update in one call (no need
      # to look up an existing record first, unlike Cloudflare's API).
      - name: Point pr-<N>.plexo.aws.charisol.io at that bare distribution
        run: |
          PREVIEW_HOSTNAME="pr-${PR_NUMBER}.plexo.aws.charisol.io"
          DISTRIBUTION_DOMAIN=$(node -pe "require('./cdk/cdk-outputs.json')['${STACK_ID}-compute-stack'].DistributionDomainName")

          CHANGE_BATCH=$(node -pe "JSON.stringify({Changes:[{Action:'UPSERT',ResourceRecordSet:{Name:process.argv[1],Type:'CNAME',TTL:60,ResourceRecords:[{Value:process.argv[2]}]}}]})" "$PREVIEW_HOSTNAME" "$DISTRIBUTION_DOMAIN")
          aws route53 change-resource-record-sets --hosted-zone-id Z08127631OJ16MLNL9RH --change-batch "$CHANGE_BATCH"
          echo "Pointed ${PREVIEW_HOSTNAME} -> ${DISTRIBUTION_DOMAIN}"

          # CloudFront's own alias-acceptance check isn't instant even against Route53 —
          # give it a moment before retrying with the alias attached, rather than racing it
          # and hitting the exact same failure this whole bare-domain-first dance exists to
          # avoid.
          sleep 30

      - name: Deploy the PR's compute stack again (now with the custom domain)
        working-directory: ./cdk
        env:
          TABLE_STACK_ID: staging-plexo
          LEDGER_KMS_KEY_ARN: arn:aws:kms:us-east-1:919927637684:key/91672c29-e32c-4524-ad2d-b9b2b2b1ef92
          # APP_CERT_ARN imports the already-issued wildcard cert for
          # *.plexo.aws.charisol.io (compute-stack.ts's own appCertArn prop skips
          # creating+DNS-validating a brand-new per-PR cert when this is set) — safe to
          # reuse across every PR's own distribution simultaneously, ACM certs aren't
          # exclusive to one distribution. DNS now resolves (previous step), so CloudFront
          # accepts the alias this time.
          APP_DOMAIN: pr-${{ github.event.number }}.plexo.aws.charisol.io
          APP_CERT_ARN: arn:aws:acm:us-east-1:919927637684:certificate/841223fd-8978-4046-bc57-d58cd402b62d
        run: npx aws-cdk deploy "${STACK_ID}-compute-stack" --require-approval never --exclusively --outputs-file cdk-outputs.json

      # Sticky comment (found-and-edited by its own marker, never re-posted) so pushing more
      # commits to the same PR updates one comment in place instead of spamming a new one on
      # every `synchronize` re-run. This is the actual point of this whole workflow from a
      # reviewer's perspective — a real, clickable URL to test the PR's own preview
      # environment before approving the merge that would otherwise be the first real test.
      - name: Comment the preview link on the PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIEW_URL="https://pr-${PR_NUMBER}.plexo.aws.charisol.io"
          MARKER="<!-- pr-preview-link -->"
          BODY=$(printf '%s\n### 🔗 PR Preview\n\nThis PR'\''s preview environment: **%s**\n\nDeployed from %s. Redeploys automatically on every push to this PR; torn down automatically when it'\''s closed.' "$MARKER" "$PREVIEW_URL" "${{ github.sha }}")

          EXISTING_COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)

          if [ -n "$EXISTING_COMMENT_ID" ]; then
            gh api "repos/${{ github.repository }}/issues/comments/${EXISTING_COMMENT_ID}" -X PATCH -f body="$BODY"
          else
            gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" -X POST -f body="$BODY"
          fi
