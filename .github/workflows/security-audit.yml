name: Weekly dependency check

# New advisories are published all the time, so a clean check today says nothing about next week. This runs the same
# check as CI every Monday and on demand; a failure shows up as a failed run (GitHub emails the people watching the repo).

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check production dependencies for known vulnerabilities
        run: node scripts/audit-gate.mjs
