name: CI

# There was no CI at all in this app before this — a broken build or a type error could only
# ever be caught by Vercel's own production build, after a push. This is deliberately minimal
# (typecheck only, no test run — see package.json's "test" script, which has no real tests to
# run yet) to establish the habit of a required PR check without blocking on work this repo
# doesn't have yet. tsconfig.json excludes cdk/ (its own separate TS project, with its own
# package.json/node_modules never installed here) and scripts/ (one-off migration tooling),
# so this needs no AWS credentials and no Prisma generate step (removed with Prisma itself).

on:
  pull_request:
  push:
    branches:
      - main
      - staging

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit
