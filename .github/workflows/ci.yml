name: CI

# There was no CI at all in this app before this — a broken build or a type error could only
# ever be caught by Vercel's own production build, after a push. This is deliberately minimal
# (typecheck only, no test run — see package.json's "test" script, which has no real tests to
# run yet) to establish the habit of a required PR check without blocking on work this repo
# doesn't have yet.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Typecheck
        run: npx tsc --noEmit
