# Keeps dependencies and CI actions current without burying the team in pull requests.
# Security fixes are opened as soon as they exist (they are separate from the schedule below). Everything else arrives at most once a
# month, as one pull request for the app's packages and one for the CI actions. Major versions are left for planned work, because they
# change behaviour (and for the deploy actions, can change how a release reaches AWS).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Stripe's library moves its API version with each release, and our code is pinned to one on purpose (payments, webhooks and refunds
      # read from it). Upgrading it is planned work with testing, not an automatic bump. Remove this when that upgrade is scheduled.
      - dependency-name: "stripe"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
