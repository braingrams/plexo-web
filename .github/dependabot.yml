# Keeps dependencies and CI actions current, so a security fix reaches the app within a week instead of waiting for someone to notice.
# Free for private repositories. Updates are grouped so a week's worth arrives as a couple of pull requests, not dozens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      security:
        applies-to: security-updates
        patterns: ["*"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Majors are planned work (they change behaviour); security fixes inside a major are still offered.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
